<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · kkpramod</title>
<link rel="icon" href="/assets/favicon.png">
<style>
:root{--bg:#0b0e10;--ink:#f1ece1;--gold:#d6a34c;--line:#233}
*{box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding:24px;line-height:1.5}
.panel{max-width:560px;margin:0 auto}
h2{font-size:22px;margin:0 0 8px}
p.hint{opacity:.7;font-size:13.5px;margin:0 0 18px}
label{display:block;font-size:12px;opacity:.7;margin:12px 0 4px}
input,textarea{font:inherit;width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#121;color:inherit}
textarea{min-height:110px;resize:vertical}
button{font:inherit;margin-top:16px;padding:11px 18px;border-radius:8px;border:none;background:var(--gold);color:#1a1208;font-weight:600;cursor:pointer}
button:hover{filter:brightness(1.05)}
#err{color:#f88;font-size:13px;min-height:1.2em}
a{color:var(--gold)}
.row{display:flex;gap:12px;margin-top:20px;align-items:center;justify-content:space-between}
</style>
</head>
<body>
<div class="panel" id="login">
  <h2>kkpramod Admin</h2>
  <p class="hint">Edit terminal identity, tagline, and boot lines. PIN protected.</p>
  <label for="pin">PIN</label>
  <input id="pin" type="password" autocomplete="current-password">
  <button type="button" id="go">Unlock</button>
  <p id="err"></p>
</div>
<div class="panel" id="app" style="display:none">
  <h2>Terminal knowledge</h2>
  <p class="hint">Changes apply immediately to the public terminal. Keep structure intact for advanced Q&amp;A (edit knowledge.json on server if needed).</p>
  <label for="tagline">Tagline</label>
  <input id="tagline">
  <label for="email">Email</label>
  <input id="email">
  <label for="wa">WhatsApp</label>
  <input id="wa">
  <label for="boot">Boot lines (one per line)</label>
  <textarea id="boot" rows="6"></textarea>
  <div class="row">
    <button type="button" id="save">Save changes</button>
    <a href="/">← Back to site</a>
  </div>
  <p id="status" style="font-size:13px;margin-top:12px;opacity:.8"></p>
</div>
<script>
let token = '';
const $ = id => document.getElementById(id);
$('go').onclick = async () => {
  $('err').textContent = '';
  try {
    const r = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin: $('pin').value })
    });
    const d = await r.json();
    if (!r.ok) { $('err').textContent = d.error || 'Fail'; return; }
    token = d.token;
    $('login').style.display = 'none';
    $('app').style.display = 'block';
    const k = await fetch('/api/admin/knowledge', { headers: { 'x-admin-token': token } }).then(r => r.json());
    $('tagline').value = k.identity?.tagline || '';
    $('email').value = k.identity?.email || '';
    $('wa').value = k.identity?.whatsapp || '';
    $('boot').value = (k.bootLines || []).join('\n');
  } catch (e) {
    $('err').textContent = 'Network error';
  }
};
$('save').onclick = async () => {
  $('status').textContent = 'Saving…';
  try {
    await fetch('/api/admin/knowledge', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
      body: JSON.stringify({
        identity: {
          tagline: $('tagline').value,
          email: $('email').value,
          whatsapp: $('wa').value
        },
        bootLines: $('boot').value.split('\n').map(s => s.trim()).filter(Boolean)
      })
    });
    $('status').textContent = 'Saved.';
  } catch (e) {
    $('status').textContent = 'Save failed.';
  }
};
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('go').click(); });
</script>
</body>
</html>
