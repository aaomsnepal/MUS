<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room — aaomsTech Quantum Shell</title>
  <meta name="description" content="Live community chat room on kkpramod.com.np — real-time discussion with AI bot.">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/png" href="/assets/favicon-infinity.png">
<link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/assets/aaoms-core.css">
  <style>
    :root { --bg:#050708; --panel:#0a0e10; --ink:#e6e2d6; --dim:#8a8780; --gold:#d4a84b; --line:#1a2220; --green:#6dcaa0; --cyan:#4ec4c8; --red:#e07070; --blue:#5b8dd6; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
    .chat-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .chat-header h2 { font-size: 14px; color: var(--gold); }
    .chat-header .online { font-size: 12px; color: var(--green); }
    .chat-header .online .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; animation: pulse 2s infinite; margin-right: 6px; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(109,202,160,.5); } 70% { box-shadow: 0 0 0 6px rgba(109,202,160,0); } 100% { box-shadow: 0 0 0 0 rgba(109,202,160,0); } }
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.4; word-wrap: break-word; }
    .msg.self { align-self: flex-end; background: rgba(212,168,75,.15); border: 1px solid rgba(212,168,75,.3); }
    .msg.other { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); }
    .msg .author { font-size: 11px; color: var(--cyan); font-weight: 600; margin-bottom: 2px; }
    .msg .time { font-size: 10px; color: var(--dim); margin-top: 3px; }
    .msg.system { align-self: center; background: transparent; color: var(--dim); font-size: 11px; border: none; padding: 4px 12px; }
    .chat-input { display: flex; gap: 8px; padding: 12px 20px; background: var(--panel); border-top: 1px solid var(--line); }
    .chat-input input { flex: 1; background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none; }
    .chat-input input:focus { border-color: rgba(212,168,75,.4); }
    .chat-input button { background: var(--gold); color: #1a1408; border: none; border-radius: 8px; padding: 10px 20px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
    .chat-input button:hover { background: #e8d5a3; }
    .chat-input button:disabled { opacity:.4; cursor:not-allowed; }
    .online-list { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
    .online-dot { width: 24px; height: 24px; border-radius: 50%; background: rgba(212,168,75,.15); border: 1px solid rgba(212,168,75,.3); display: flex; align-items: center; justify-content: center; font-size: 10px; color: var(--gold); font-weight: 700; }
    @media (max-width: 600px) { .msg { max-width: 85%; } .chat-input input { font-size: 12px; } }
  </style>
</head>
<body>
  <div class="chat-header">
    <h2>💬 Chat Room</h2>
    <div class="online"><span class="dot"></span><span id="onlineCount">0</span> live</div>
  </div>
  <div class="online-list" id="onlineList"></div>
  <div class="chat-messages" id="messages"></div>
  <div class="chat-input">
    <input type="text" id="msgInput" placeholder="Type a message..." maxlength="500" autocomplete="off">
    <button type="button" id="sendBtn" onclick="sendMsg()">Send</button>
  </div>
<script>
const WS = '/ws/chat';
let ws = null;
let myName = 'User_' + Math.floor(1000 + Math.random() * 9000);
const msgEl = document.getElementById('messages');
const onlineEl = document.getElementById('onlineCount');
const onlineListEl = document.getElementById('onlineList');
const inputEl = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

function connect() {
  ws = new WebSocket(WS);
  ws.onopen = function() {
    addSystem('Connected — you are "' + myName + '"');
    ws.send(JSON.stringify({ type: 'name', name: myName }));
  };
  ws.onmessage = function(e) {
    try {
      const d = JSON.parse(e.data);
      if (d.type === 'presence') {
        onlineEl.textContent = d.online;
        renderOnline(d.online);
      } else if (d.type === 'message') {
        addMessage(d.name, d.text, d.name === myName);
      } else if (d.type === 'history') {
        if (d.messages && d.messages.length) {
          d.messages.forEach(function(m) { addMessage(m.name, m.text, m.name === myName); });
          msgEl.scrollTop = msgEl.scrollHeight;
        }
      } else if (d.type === 'hello') {
        addSystem('Welcome! ' + d.online + ' people online.');
      } else if (d.type === 'system') {
        addSystem(d.text || '');
      }
    } catch(err) {}
  };
  ws.onclose = function() {
    addSystem('Disconnected. Reconnecting...');
    setTimeout(connect, 2000);
  };
  ws.onerror = function() { ws.close(); };
}

function renderOnline(count) {
  onlineListEl.innerHTML = '';
  var names = ['Alpha','Beta','Gamma','Delta','Epsilon','Zeta','Eta','Theta','Iota','Kappa','Lambda','Mu','Nu','Xi','Omicron','Pi','Rho','Sigma','Tau','Upsilon','Phi','Chi','Psi','Omega','Nova','Pulse','Echo','Flux','Nexus','Vertex'];
  var shown = Math.min(count, 30);
  for (var i = 0; i < shown; i++) {
    var dot = document.createElement('span');
    dot.className = 'online-dot';
    dot.textContent = names[i % names.length][0];
    dot.title = names[i % names.length] + '#' + (i+1);
    onlineListEl.appendChild(dot);
  }
  if (count > 30) {
    var more = document.createElement('span');
    more.className = 'online-dot';
    more.style.background = 'rgba(78,196,200,.15)';
    more.style.borderColor = 'rgba(78,196,200,.3)';
    more.style.color = 'var(--cyan)';
    more.textContent = '+' + (count - 30);
    more.title = count + ' people online';
    onlineListEl.appendChild(more);
  }
}

function addMessage(name, text, self) {
  var d = document.createElement('div');
  d.className = 'msg ' + (self ? 'self' : 'other');
  d.innerHTML = '<div class="author">' + esc(name) + '</div><div>' + esc(text) + '</div><div class="time">' + new Date().toLocaleTimeString() + '</div>';
  msgEl.appendChild(d);
  msgEl.scrollTop = msgEl.scrollHeight;
}

function addSystem(text) {
  var d = document.createElement('div');
  d.className = 'msg system';
  d.textContent = text;
  msgEl.appendChild(d);
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function sendMsg() {
  var text = inputEl.value.trim();
  if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'message', text: text }));
    inputEl.value = '';
  }
}

inputEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMsg(); });
connect();
</script>

  <div class="pwa-text">ðŸ“² Install <strong>kkpramod</strong> on your phone for instant NEPSE updates &amp; aaoms news</div>
  <div class="pwa-actions">
    <button id="pwaInstall">Install</button>
    <button id="pwaNotify">ðŸ”” Notify Me</button>
    <button id="pwaDismiss">Later</button>
  </div>
</div>
<script src="/assets/pwa.js"></script>
</body>
</html>
